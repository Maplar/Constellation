<?xml version="1.0" encoding="UTF-8"?>
<!--
  NSIS Installer Icon - 星座安装程序图标
  设计风格：篆刻印章风格
-->
<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.15"/>
    </filter>
  </defs>
  
  <!-- 外框 - 印章风格 -->
  <rect x="16" y="16" width="224" height="224" rx="12" fill="#c04040"/>
  <rect x="20" y="20" width="216" height="216" rx="10" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>
  
  <!-- 内框装饰 -->
  <rect x="32" y="32" width="192" height="192" rx="6" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="0.8"/>
  
  <!-- 星座图案 -->
  <circle cx="128" cy="100" r="12" fill="white" opacity="0.9"/>
  <circle cx="88" cy="70" r="6" fill="white" opacity="0.6"/>
  <circle cx="168" cy="70" r="6" fill="white" opacity="0.6"/>
  <circle cx="88" cy="140" r="6" fill="white" opacity="0.5"/>
  <circle cx="168" cy="140" r="6" fill="white" opacity="0.5"/>
  <circle cx="128" cy="55" r="4" fill="white" opacity="0.4"/>
  
  <!-- 连接线 -->
  <line x1="128" y1="100" x2="88" y2="70" stroke="white" stroke-width="1.5" opacity="0.5"/>
  <line x1="128" y1="100" x2="168" y2="70" stroke="white" stroke-width="1.5" opacity="0.5"/>
  <line x1="88" y1="70" x2="88" y2="140" stroke="white" stroke-width="1" opacity="0.3"/>
  <line x1="168" y1="70" x2="168" y2="140" stroke="white" stroke-width="1" opacity="0.3"/>
  <line x1="128" y1="100" x2="128" y2="55" stroke="white" stroke-width="1" opacity="0.35"/>
  
  <!-- 文字 -->
  <text x="128" y="185" font-family="KaiTi, STKaiti, serif" font-size="36" fill="white" text-anchor="middle" font-weight="bold">星座</text>
  <text x="128" y="210" font-family="Microsoft YaHei UI, sans-serif" font-size="12" fill="rgba(255,255,255,0.7)" text-anchor="middle">Constellation</text>
</svg>
