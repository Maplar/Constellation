<?xml version="1.0" encoding="UTF-8"?>
<!--
  NSIS Sidebar Image - 星座安装向导左侧侧边栏
  尺寸: 164 × 314 像素
  格式: 需转换为 24位 BMP (不支持透明度)
-->
<svg width="164" height="314" viewBox="0 0 164 314" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 背景渐变 -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f6f3ec"/>
      <stop offset="100%" stop-color="#e5e1d8"/>
    </linearGradient>
    
    <!-- 纸张纹理 -->
    <filter id="paper">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" result="noise"/>
      <feColorMatrix type="saturate" values="0" in="noise" result="gray"/>
      <feBlend in="SourceGraphic" in2="gray" mode="multiply" result="blend"/>
      <feComponentTransfer in="blend">
        <feFuncA type="linear" slope="0.03"/>
      </feComponentTransfer>
    </filter>
  </defs>
  
  <!-- 背景 -->
  <rect width="164" height="314" fill="url(#bgGrad)"/>
  
  <!-- 纸张纹理叠加 -->
  <rect width="164" height="314" fill="#8a8580" opacity="0.02" filter="url(#paper)"/>
  
  <!-- 水墨山水装饰 - 远山轮廓 -->
  <path d="M0,200 Q20,160 40,180 Q60,140 80,170 Q100,130 120,160 Q140,140 164,175 L164,250 Q140,230 120,240 Q100,220 80,235 Q60,225 40,240 Q20,230 0,245 Z" 
        fill="#1a1a1a" opacity="0.04"/>
  <path d="M0,220 Q30,190 50,210 Q70,180 90,200 Q110,175 130,195 Q150,185 164,200 L164,260 Q140,250 120,255 Q100,245 80,252 Q60,248 40,255 Q20,250 0,258 Z" 
        fill="#1a1a1a" opacity="0.03"/>
  
  <!-- 篆刻印章 - "星座"二字 -->
  <rect x="52" y="100" width="60" height="60" rx="3" fill="#c04040"/>
  <rect x="54" y="102" width="56" height="56" rx="2" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="0.8"/>
  <text x="82" y="125" font-family="KaiTi, STKaiti, serif" font-size="20" fill="white" text-anchor="middle" font-weight="bold">星</text>
  <text x="82" y="150" font-family="KaiTi, STKaiti, serif" font-size="20" fill="white" text-anchor="middle" font-weight="bold">座</text>
  
  <!-- 装饰星点 -->
  <circle cx="30" cy="60" r="2" fill="#4a7a6b" opacity="0.3"/>
  <circle cx="140" cy="80" r="1.5" fill="#4a7a6b" opacity="0.25"/>
  <circle cx="20" cy="250" r="1" fill="#4a7a6b" opacity="0.2"/>
  <circle cx="150" cy="270" r="1.5" fill="#4a7a6b" opacity="0.15"/>
  
  <!-- Slogan -->
  <text x="82" y="295" font-family="Microsoft YaHei UI, sans-serif" font-size="9" fill="#8a8580" text-anchor="middle">轻量 · 优雅 · 现代</text>
</svg>
